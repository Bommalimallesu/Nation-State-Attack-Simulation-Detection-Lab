title: LSASS Access via Suspicious Process
id: a1b2c3d4-e5f6-7890-1234-567890abcdef
status: experimental
description: Detects processes accessing LSASS (Local Security Authority Subsystem Service), which may indicate credential dumping using Mimikatz, Procdump, or similar tools.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Lab Simulation
date: 2026-06-10
tags:
    - attack.credential_access
    - attack.t1003.001

logsource:
    product: windows
    service: sysmon
    category: process_access

detection:
    selection:
        EventID: 10
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1FFFFF'
            - '0x1010'
            - '0x1438'

    filter:
        SourceImage|endswith:
            - '\lsass.exe'
            - '\svchost.exe'
            - '\lsm.exe'

    condition: selection and not filter

falsepositives:
    - Endpoint protection / EDR security products
level: critical
---
title: LSASS Handle Request (Security Event 4663)
id: b2c3d4e5-f6a7-8901-2345-67890abcdef1
status: experimental
description: Detects handle requests to LSASS object, which may indicate credential dumping attempts.
references:
    - https://attack.mitre.org/techniques/T1003/001/

logsource:
    product: windows
    service: security
    category: object_access

detection:
    selection:
        EventID: 4663
        ObjectName|contains: '\lsass.exe'
        AccessMask:
            - '0x1FFFFF'

    condition: selection

falsepositives:
    - Rare legitimate security auditing tools
level: critical
---
title: Mimikatz or Credential Dumping Tool Execution
id: c3d4e5f6-a7b8-9012-3456-7890abcdef12
status: experimental
description: Detects execution of credential dumping tools such as Mimikatz, Procdump, or Meterpreter Kiwi.
references:
    - https://attack.mitre.org/software/S0002/

logsource:
    product: windows
    service: security
    category: process_creation

detection:
    selection:
        EventID: 4688
        ProcessName|endswith:
            - '\mimikatz.exe'
            - '\procdump.exe'
            - '\rundll32.exe'
        CommandLine|contains:
            - 'sekurlsa::logonpasswords'
            - 'privilege::debug'
            - 'lsass'
            - 'kiwi'

    condition: selection

falsepositives:
    - Security testing tools in lab environments
level: critical