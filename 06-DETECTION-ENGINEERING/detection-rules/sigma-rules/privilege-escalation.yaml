title: UAC Bypass via LOLBins (eventvwr, sdclt, fodhelper, computerdefaults)
id: a1b2c3d4-5e6f-7890-1234-567890abcdef
status: experimental
description: Detects UAC bypass attempts using Windows LOLBins that spawn elevated cmd or PowerShell.
references:
  - https://attack.mitre.org/techniques/T1548/002/
  - https://www.elastic.co/guide/en/security/current/uac-bypass-via-eventvwr.html

author: Lab Simulation
level: high

logsource:
  product: windows
  category: process_creation

detection:
  selection_parent:
    ParentImage|endswith:
      - '\eventvwr.exe'
      - '\sdclt.exe'
      - '\fodhelper.exe'
      - '\computerdefaults.exe'

  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\powershell_ise.exe'

  condition: selection_parent and selection_child

falsepositives:
  - Rare administrative debugging activity

tags:
  - attack.privilege_escalation
  - attack.t1548.002