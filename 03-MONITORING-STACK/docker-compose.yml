# docker-compose.yml
# Nation-State Lab Monitoring Stack
# Elasticsearch + Kibana
# Purpose: Centralized log storage and visualization for Winlogbeat and Filebeat
# Network: Isolated host-only lab network

version: "3.8"

networks:
  elastic:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch

    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "192.168.1.100:9200:9200"
      - "192.168.1.100:9300:9300"

    networks:
      - elastic

    restart: unless-stopped

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kibana

    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      XPACK_SECURITY_ENABLED: "false"

    ports:
      - "192.168.1.100:5601:5601"

    networks:
      - elastic

    depends_on:
      - elasticsearch

    restart: unless-stopped

    volumes:
      - kibana-data:/usr/share/kibana/data

volumes:
  elasticsearch-data:
    driver: local

  kibana-data:
    driver: local